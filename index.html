<body>
<canvas id="stage" aria-label="A cartoon announcing the new name Banana Joe Champagne"></canvas>
<button class="btn" id="again" aria-label="Play again"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4v5h5"/></svg></button>
<button class="btn" id="mute" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l5 4v-13l-5 4H4z"/><path class="on" d="M16 9a4.5 4.5 0 0 1 0 6"/><path class="on" d="M18.5 6.5a8 8 0 0 1 0 11"/><path class="off" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
<script>
(() => {
'use strict';

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;   // ?t=25 shows one still frame
const FAM = '"BJC","Arial Rounded MT Bold",ui-rounded,"Chalkboard SE","Comic Sans MS",system-ui,sans-serif';
const F100 = '700 100px ' + FAM;

/* ------------------------------------------------------------ helpers */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, start, dur) => clamp((t - start) / dur);
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInCubic = p => p * p * p;
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOutBack = p => 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2);
const spring = (e, amp, damp, freq) => e < 0 ? 0 : amp * Math.exp(-damp * e) * Math.cos(freq * e);
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const PARTY = ['#FF4D6D', '#FF9F1C', '#FFE14D', '#3DDC84', '#3DA5FF', '#9B6BFF', '#FF7AD9', '#FFFFFF'];

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function starPath(x, y, R, r, n, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, d = i % 2 ? r : R, px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); ctx.closePath();
}

/* ------------------------------------------------------------ text */
let CAP = 0.7;                       // cap height as a fraction of the font size
let wcache = {};
function w100(str) { if (wcache[str] == null) { ctx.font = F100; wcache[str] = ctx.measureText(str).width; } return wcache[str]; }
function label(str, x, y, size, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(size / 100, size / 100);
  ctx.font = F100; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color; ctx.fillText(str, 0, 0); ctx.restore();
}
function sticker(str, x, y, size, fill, line, o = {}) {
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); ctx.scale(size / 100, size / 100);
  ctx.font = F100; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (o.white) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 30; ctx.strokeText(str, 0, 0); }
  ctx.strokeStyle = line; ctx.lineWidth = o.lw || 14; ctx.strokeText(str, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(str, 0, 0); ctx.restore();
}

/* ------------------------------------------------------------ timeline (seconds) */
const T = { newsOut: 3.8, meadow: 4.4, bananaIn: 4.5, ribbon: 5.0, B: 6.2, J: 9.0, C: 13.0, shake: 14.2, pop: 15.2, Cpop: 19.1, finale: 21.5 };
const tB = i => T.B + i * 0.3 + 0.4;          // BANANA letter i lands
const tJs = i => T.J + i * 0.5;               // JOE balloon i lifts off
const tJp = i => T.J + i * 0.5 + 2.2;         // JOE balloon i pops
const tCs = i => T.pop + 0.15 + i * 0.16;     // CHAMPAGNE bubble i leaves the bottle
const tCp = i => T.Cpop + i * 0.2;            // CHAMPAGNE bubble i pops
const landTime = l => l.w === 0 ? tB(l.i) : l.w === 1 ? tJp(l.i) : tCp(l.i);
const BEAT = 60 / 138, MUSIC0 = T.finale + 1.7;
const FW_N = 5, FW_LAUNCH = 0.55, fwPer = k => 2.3 + k * 0.37, fwOff = k => k * 0.53;

/* ------------------------------------------------------------ stage + layout */
let W = 1000, H = 1000, S = 1, DPR = 1;   // the short side of the window is always 1000 units
const L = {};
const WORDS = ['BANANA', 'JOE', 'CHAMPAGNE'];
let LET = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const box = cv.getBoundingClientRect();
  const cw = Math.max(50, box.width || window.innerWidth), ch = Math.max(50, box.height || window.innerHeight);
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  S = Math.min(cw, ch) / 1000; W = cw / S; H = ch / S;
  layout();
}

function layout() {
  const wide = W / H >= 1.25;          // wide: characters flank the name; tall: they stand below it
  L.wide = wide;
  L.ribbonY = H * (wide ? 0.105 : 0.13);
  L.ribbonW = Math.min(W * 0.66, 700);
  L.feetY = H * 0.93;
  let box;
  if (wide) {
    const bw = Math.min(W * 0.54, 1040), side = (W - bw) / 2;
    L.cs = Math.min(H * 0.5, side * 1.2) / 400; L.bananaX = side * 0.55; L.bottleX = W - side * 0.5;
    box = { w: bw, top: H * 0.2, bot: H * 0.76 };
  } else {
    L.cs = Math.min(H * 0.27, W * 0.52) / 400; L.bananaX = W * 0.27; L.bottleX = W * 0.74;
    box = { w: W * 0.92, top: Math.max(H * 0.19, L.ribbonY + 100), bot: L.feetY - 400 * L.cs - H * 0.04 };
  }
  const TR = 9;
  const ww = WORDS.map(w => [...w].reduce((s, c) => s + w100(c), 0) + TR * (w.length - 1));
  let sC = box.w / ww[2] * 100;
  let sB = Math.min(box.w * 0.94 / ww[0] * 100, sC * 1.5);
  let sJ = Math.min(box.w * 0.8 / ww[1] * 100, sC * (wide ? 1.7 : 2.3));
  let gap = sC * (wide ? 0.26 : 0.42);
  let tot = CAP * (sB + sJ + sC) + 2 * gap;
  const avail = box.bot - box.top;
  if (tot > avail) { const k = avail / tot; sB *= k; sJ *= k; sC *= k; gap *= k; tot = avail; }
  const top = box.top + (avail - tot) / 2;
  const sizes = [sB, sJ, sC];
  const bases = [top + CAP * sB, top + CAP * sB + gap + CAP * sJ, top + tot];
  const old = LET; LET = []; let k = 0;
  WORDS.forEach((w, wi) => {
    const s = sizes[wi]; let cur = W / 2 - ww[wi] * s / 200;
    [...w].forEach((ch, i) => {
      const cw = w100(ch) * s / 100;
      LET.push({ ch, w: wi, i, k, x: cur + cw / 2, base: bases[wi], size: s, kick: old[k] ? old[k].kick : -99 });
      k++; cur += cw + TR * s / 100;
    });
  });
  L.words = WORDS.map((w, wi) => ({ x0: W / 2 - ww[wi] * sizes[wi] / 200, x1: W / 2 + ww[wi] * sizes[wi] / 200, base: bases[wi], size: sizes[wi] }));
  L.nameTop = top; L.nameBot = top + tot; L.nameW = box.w;
  L.mouth = { x: L.bottleX, y: L.feetY - 392 * L.cs };
  L.rbCy = H * 0.87; L.rbR = wide ? Math.min(H * 0.78, W * 0.46) : Math.min(W * 0.64, H * 0.6);
}

/* ------------------------------------------------------------ scenery */

/* ------------------------------------------------------------ scene: Banana Joe */
function drawBananaScene(t) {
  if (t < T.bananaIn) return;
  const cs = L.cs;
  const P = { hop: 0, sq: 1, lean: 0, armL: 0.45, armR: 0.45, look: [0.4, -0.3], blink: 0, mouth: 0.45, happy: false, wow: false, mm: null, crown: null, stride: 0 };
  let x = L.bananaX;
  const bt = (t * 0.31 + 0.2) % 1; P.blink = bt > 0.95 ? Math.sin((bt - 0.95) / 0.05 * Math.PI) : 0;
  P.sq = 1 + Math.sin(t * 3.1) * 0.012;
  const e0 = t - T.bananaIn;
  if (e0 < 1.5) {                                   // hops in from the left
    x = lerp(-170 * cs, L.bananaX, e0 / 1.5);
    const hp = (e0 / 0.5) % 1, a = Math.sin(hp * Math.PI);
    P.hop = a * 110; P.sq = 1 + a * 0.1 - Math.max(0, 0.15 - hp) * 0.9; P.lean = 0.13; P.stride = Math.cos(hp * Math.PI);
    P.armL = P.armR = 0.9 + a * 0.8; P.look = [0.9, 0]; P.mouth = 0.7;
  } else if (t < T.J) {                             // watches BANANA land, then cheers
    P.look = [0.55, -0.85];
    for (let i = 0; i < 6; i++) { const e = t - tB(i); if (e >= 0 && e < 0.26) P.hop = Math.sin(e / 0.26 * Math.PI) * 30; }
    const c = prog(t, tB(5) + 0.15, 0.25) * (1 - prog(t, T.J - 0.35, 0.3));
    P.armL = lerp(0.5, 2.55 + Math.sin(t * 13) * 0.28, c); P.armR = lerp(0.5, 2.55 - Math.sin(t * 13) * 0.28, c);
    P.mouth = lerp(0.5, 1, c); P.happy = c > 0.5; P.hop += c * Math.abs(Math.sin(t * 9)) * 40;
  } else if (t < T.C) {                             // follows the balloons up
    const up = easeInOut(prog(t, T.J + 0.3, 2.0));
    P.look = [0.6, lerp(0.9, -0.8, up)];
    P.armR = 0.45 + 1.6 * prog(t, T.J, 0.4) * (1 - prog(t, tJp(2) + 0.3, 0.5));
    for (let i = 0; i < 3; i++) { const e = t - tJp(i); if (e >= 0 && e < 0.3) { P.hop = Math.sin(e / 0.3 * Math.PI) * 46; P.mouth = 1; P.wow = true; } }
    const c = prog(t, tJp(2) + 0.35, 0.25) * (1 - prog(t, T.C - 0.2, 0.2));
    if (c > 0) { P.armL = lerp(P.armL, 2.5 + Math.sin(t * 13) * 0.3, c); P.armR = lerp(P.armR, 2.5 - Math.sin(t * 13) * 0.3, c); P.happy = c > 0.5; P.mouth = 1; }
  } else if (t < T.finale) {                        // meets the bottle
    P.look = [1, 0.15];
    const k = prog(t, T.shake, T.pop - T.shake) * (t < T.pop ? 1 : 0);
    P.lean = -0.12 * k; P.armL = P.armR = 0.45 + 1.0 * k; if (k > 0.05) { P.mm = 'o'; P.wow = true; }
    const e = t - T.pop;
    if (e >= 0) {
      P.look = [0.7, lerp(0.1, -0.85, prog(e, 0.3, 1.2))];
      if (e < 0.5) { P.hop = Math.sin(e / 0.5 * Math.PI) * 95; P.wow = true; P.mm = 'o'; }
      P.mouth = 0.9;
      const c = prog(t, T.Cpop - 0.1, 0.3);
      if (c > 0) { P.hop = Math.abs(Math.sin((t - T.Cpop) * Math.PI / 0.4)) * 30 * c; P.armL = lerp(0.45, 2.5, c); P.armR = lerp(0.45, 2.5, c); P.happy = true; P.mouth = 1; }
    }
  } else {                                          // finale: crown + dance
    const tf = t - T.finale, bp = (t - MUSIC0) / BEAT;
    P.mouth = 1; P.look = [0.3, -0.3];
    if (tf < 1.7) {
      P.hop = Math.abs(Math.sin(tf * 6.5)) * 70; P.armL = 2.6 + Math.sin(t * 15) * 0.3; P.armR = 2.6 - Math.sin(t * 15) * 0.3; P.happy = true;
    } else {
      const b = Math.abs(Math.sin(bp * Math.PI));
      P.hop = b * 36; P.lean = Math.sin(bp * Math.PI / 2) * 0.17; P.sq = 1 + (b - 0.5) * 0.08; P.stride = Math.sin(bp * Math.PI / 2) * 0.8;
      P.armL = 2.3 + Math.sin(bp * Math.PI) * 0.55; P.armR = 2.3 - Math.sin(bp * Math.PI) * 0.55; P.happy = (Math.floor(bp) % 8) < 6;
    }

    drawBurst(x + 52 * cs, L.feetY - 400 * cs, ce - 0.45, 77, { n: 12, kind: 'star', speed: 520 * cs, size: 15 * cs, cols: ['#FFE14D', '#FFFFFF', '#FFB627'], life: 0.8 });
  }

}

/* ------------------------------------------------------------ scene: the bubbly bottle */
function drawStream(t) {
  const e = t - T.pop; if (e < 0) return;
  const rise = L.mouth.y + 140;
  for (let i = 0; i < 12; i++) {
    const per = 3.4 + rnd(i + 20) * 1.6, c = e / per - rnd(i + 30); if (c < 0) continue;
    const p = c % 1, cyc = Math.floor(c);
    const x = L.mouth.x + Math.sin(p * 7 + i * 2.2 + cyc) * (30 + 90 * p) + (rnd(i * 3 + cyc) - 0.5) * 170 * p;
    drawBubble(x, L.mouth.y - p * rise, (9 + 20 * rnd(i * 5 + cyc + 1)) * L.cs * Math.min(1, p * 6), Math.min(1, (1 - p) * 4));
  }
}
function drawFoam(t) {
  const e = t - T.pop; if (e < 0 || e > 2.8) return;
  ctx.save();
  for (let i = 0; i < 46; i++) {
    const d = rnd(i + 200) * 1.3, pe = e - d, life = 0.9 + rnd(i + 210) * 0.5; if (pe < 0 || pe > life) continue;
    const a = -Math.PI / 2 + (rnd(i + 220) - 0.5) * 0.9, v = (700 + 600 * rnd(i + 230)) * L.cs * (1 - d / 1.8);
    ctx.globalAlpha = 1 - pe / life; ctx.fillStyle = i % 3 ? '#FFFFFF' : '#FFE9A8';
    circ(L.mouth.x + Math.cos(a) * v * pe, L.mouth.y + Math.sin(a) * v * pe + 1300 * L.cs * pe * pe, (7 + 12 * rnd(i + 240)) * L.cs * (1 - pe / life * 0.6)); ctx.fill();
  }
  ctx.restore();
}
function drawBottleScene(t) {
  if (t < T.C) return;
  const cs = L.cs;
  const P = { hop: 0, sq: 1, lean: 0, shake: 0, armL: 0.45, armR: 0.45, look: [-0.6, -0.1], blink: 0, mouth: 0.5, eyes: 'open', mm: null, cork: t < T.pop, stride: 0, puff: 0 };
  let x = L.bottleX;
  const bt = (t * 0.27 + 0.6) % 1; P.blink = bt > 0.95 ? Math.sin((bt - 0.95) / 0.05 * Math.PI) : 0;
  const e0 = t - T.C;
  if (e0 < 1.1) {                                   // hops in from the right
    x = lerp(W + 150 * cs, L.bottleX, e0 / 1.1);
    const hp = (e0 / (1.1 / 3)) % 1, a = Math.sin(hp * Math.PI);
    P.hop = a * 90; P.sq = 1 + a * 0.08; P.lean = -0.1; P.armL = P.armR = 0.9 + a * 0.7; P.mouth = 0.8; P.stride = Math.cos(hp * Math.PI) * 0.6;
  } else if (t < T.shake) {
    P.armL = 2.4 + Math.sin(t * 13) * 0.35; P.mouth = 0.9;
  } else if (t < T.pop) {                           // shake shake shake
    const k = prog(t, T.shake, T.pop - T.shake);
    P.lean = Math.sin(t * 40) * 0.06 * (0.35 + k); P.shake = Math.sin(t * 53) * 7 * (0.35 + k) * cs;
    P.eyes = 'squeeze'; P.mm = 'wavy'; P.sq = 1 - 0.07 * k; P.armL = P.armR = 1.3 + 0.5 * k; P.puff = k;
  } else if (t < T.finale) {                        // POP!
    const e = t - T.pop;
    P.sq = 1 + spring(e, 0.2, 4.5, 15); P.look = [-0.5, -0.8]; P.mouth = 0.95;
    if (e < 0.9) { P.eyes = 'wow'; P.mm = 'o'; }
    if (e < 0.4) P.hop = Math.sin(e / 0.4 * Math.PI) * 50;
    const up = 1 - prog(e, 1.6, 0.8);
    P.armL = lerp(0.5, 2.6 + Math.sin(t * 12) * 0.2, up); P.armR = lerp(0.5, 2.6 - Math.sin(t * 12) * 0.2, up);
    const c = prog(t, T.Cpop - 0.1, 0.3);
    if (c > 0) { P.hop = Math.abs(Math.sin((t - T.Cpop) * Math.PI / 0.4 + 1.2)) * 26 * c; P.eyes = 'happy'; P.armL = lerp(P.armL, 2.4, c); P.armR = lerp(P.armR, 2.4, c); }
  } else {                                          // finale dance (mirrors the banana)
    const tf = t - T.finale, bp = (t - MUSIC0) / BEAT;
    P.mouth = 1; P.look = [-0.3, -0.3]; P.eyes = 'happy';
    if (tf < 1.7) { P.hop = Math.abs(Math.sin(tf * 6.5 + 1)) * 60; P.armL = 2.6 + Math.sin(t * 15) * 0.3; P.armR = 2.6 - Math.sin(t * 15) * 0.3; }
    else {
      const b = Math.abs(Math.sin(bp * Math.PI));
      P.hop = b * 30; P.lean = -Math.sin(bp * Math.PI / 2) * 0.15; P.sq = 1 + (b - 0.5) * 0.07; P.stride = Math.sin(bp * Math.PI / 2) * 0.7;

    }
  }
  drawStream(t); drawFoam(t);
  drawBottle(x, L.feetY, cs, P);
  const e = t - T.pop;
  if (e >= 0 && e < 1.4) {                          // the cork flies away
    ctx.save(); ctx.translate(L.mouth.x - 260 * cs * e * (L.wide ? 1.5 : 1), L.mouth.y - 20 * cs - 2300 * cs * e + 900 * cs * e * e);
    ctx.rotate(-e * 11); ctx.scale(cs, cs); ctx.translate(0, 18); drawCork(); ctx.restore();
  }
  drawPow(L.mouth.x - 20 * cs, L.mouth.y - 150 * cs, 125 * cs, e, 1.0, 'POP!');
}

/* ------------------------------------------------------------ scene: the name */
const STY = [
  { fill: ['#FFF27A', '#FFC400'], line: '#7A4A12' },
  null,
  { fill: ['#FF8AC9', '#FFC94D'], line: '#A3195B' },
];
const JOE = [
  { fill: ['#FF8FA3', '#F0264A'], line: '#8E0F2B' },
  { fill: ['#8AD0FF', '#1E88F0'], line: '#0B4C99' },
  { fill: ['#98F2B2', '#1FB862'], line: '#0C6B37' },
];

function letterState(l, t) {
  const s = { x: l.x, y: l.base, sx: 1, sy: 1, rot: 0, sc: 1, vis: false, landed: false, balloon: null, bubble: null };
  const cap = CAP * l.size;
  if (l.w === 0) {                                  // BANANA: drops from the sky and squishes
    const e = t - tB(l.i); if (e < -0.4) return s;
    s.vis = true;
    if (e < 0) { const p = (e + 0.4) / 0.4; s.y = lerp(-l.size * 0.2, l.base, p * p); s.sy = 1.18; s.sx = 0.88; }
    else { s.landed = true; const q = spring(e, 1, 5.5, 17); s.sy = 1 - 0.36 * q; s.sx = 1 + 0.26 * q; }
  } else if (l.w === 1) {                           // JOE: floats up under a balloon
    const e = t - tJs(l.i); if (e < 0) return s;
    s.vis = true;
    const pe = t - tJp(l.i), hover = l.size * 0.05;
    if (pe < 0) {
      const q = easeOutCubic(clamp(e / 1.9));
      s.y = lerp(H + l.size * 1.6, l.base - hover, q) + Math.sin(t * 2.4 + l.i) * 5 * q;
      s.x = l.x + Math.sin(t * 1.7 + l.i * 2.1) * 30 * (1 - q);
      s.rot = Math.sin(t * 2.1 + l.i) * 0.06;
      s.balloon = { sway: Math.sin(t * 1.9 + l.i * 1.3) * 0.1 };
    } else {
      s.landed = true;
      const f = clamp(pe / 0.12); s.y = l.base - hover * (1 - f * f);
      if (pe >= 0.12) { const q = spring(pe - 0.12, 1, 6, 16); s.sy = 1 - 0.26 * q; s.sx = 1 + 0.2 * q; }
    }
  } else {                                          // CHAMPAGNE: rides out of the bottle in a bubble
    const e = t - tCs(l.i); if (e < 0) return s;
    s.vis = true;
    const pe = t - tCp(l.i);
    if (pe < 0) {
      const p = clamp(e / 2.3), q = easeInOut(p), arc = Math.sin(Math.PI * p), bob = prog(e, 2.3, 0.5);
      const cx = lerp(L.mouth.x, l.x, q) + Math.sin(e * 3.1 + l.i * 1.7) * 46 * arc + Math.cos(t * 1.7 + l.i) * 4 * bob;
      const cy = lerp(L.mouth.y, l.base - cap / 2, q) - arc * (40 + 50 * rnd(l.i + 5)) + Math.sin(t * 2.3 + l.i * 0.8) * 6 * bob;
      const grow = lerp(0.12, 1, easeOutCubic(clamp(p * 1.7)));
      s.sc = grow * 0.78; s.x = cx; s.y = cy + cap / 2 * s.sc;
      s.bubble = { x: cx, y: cy, r: l.size * 0.5 * grow };
    } else { s.landed = true; s.sc = 1 - 0.22 * spring(pe, 1, 6, 15); }
  }
  if (s.landed) {                                   // idle wiggle, finale wave, tap kicks
    const idle = clamp(t - landTime(l));
    s.rot += Math.sin(t * 2.0 + l.k * 0.9) * 0.045 * idle;
    s.y += Math.sin(t * 2.6 + l.k * 0.7) * l.size * 0.018 * idle;
    if (t > T.finale) {
      const tf = t - T.finale;
      if (tf < 0.5) s.y -= Math.sin(tf / 0.5 * Math.PI) * l.size * 0.25;
      const h = Math.pow(Math.max(0, Math.sin(tf * 3.2 - l.k * 0.42)), 8) * prog(tf, 0.6, 0.6);
      s.y -= h * l.size * 0.2; s.sy *= 1 + h * 0.12; s.sx *= 1 - h * 0.06;
    }
    const ke = t - l.kick;
    if (ke >= 0 && ke < 0.7) { s.y -= Math.sin(Math.min(1, ke / 0.45) * Math.PI) * l.size * 0.32; s.rot += Math.sin(ke * 22) * 0.2 * Math.exp(-5 * ke); }
  }
  return s;
}
function glyph(l, s, pass) {

    ctx.strokeStyle = '#fff'; ctx.lineWidth = 26; ctx.strokeText(l.ch, 0, 0);

}
function drawLetters(t) {

  for (let w = 0; w < 3; w++) {
    const ls = LET.filter(l => l.w === w);
    for (const l of ls) { const s = st[l.k]; if (s.vis && !s.bubble) glyph(l, s, 0); }
    if (w === 1) for (const l of ls) {
      const s = st[l.k]; if (!s.balloon) continue;

    }
    for (const l of ls) { const s = st[l.k]; if (s.vis) glyph(l, s, 1); }
    if (w === 2) for (const l of ls) { const s = st[l.k]; if (s.bubble) drawBubble(s.bubble.x, s.bubble.y, s.bubble.r); }
  }
  ctx.restore();
  for (const l of LET) {                            // little celebrations as each letter arrives
    const cap = CAP * l.size;
    if (l.w === 0) drawBurst(l.x, l.base, t - tB(l.i), 100 + l.i * 7, { n: 7, kind: 'star', up: true, speed: 2.2 * l.size, size: l.size * 0.07, cols: ['#FFE14D', '#FFFFFF', '#FFB627'], grav: 500 });
    else if (l.w === 1) {
      const by = l.base - l.size * 0.05 - cap - l.size * 0.2 - l.size * 0.3, e = t - tJp(l.i);
      drawPow(l.x, by, l.size * 0.34, e, 0.4);
      drawBurst(l.x, by, e, 200 + l.i * 11, { n: 14, kind: 'conf', speed: 2.6 * l.size, size: l.size * 0.05, life: 0.9 });
    } else {
      const e = t - tCp(l.i);
      drawRing(l.x, l.base - cap / 2, l.size * 0.5, e, 0.4);
      drawBurst(l.x, l.base - cap / 2, e, 300 + l.i * 13, { n: 9, speed: 2.4 * l.size, size: l.size * 0.06, cols: ['#FFFFFF', '#BFEFFF', '#FFE9A8'], life: 0.5, grav: 300 });
    }
  }
  const wc = L.words[2], sa = prog(t, tCp(8) + 0.1, 0.5);   // twinkles on CHAMPAGNE, then the whole name

    });
  }
  add(MUSIC0 + LOOPS * LOOP, at => { [48, 60, 64, 67, 72, 84].forEach(n => bell(at, n, 1.6, 0.1)); kick(at); noise(at, 1.2, { vol: 0.08, type: 'highpass', freq: 5000 }); });
  // firework booms, timed to the drawing
  for (let k = 0; k < FW_N; k++) for (let c = 0; ; c++) {
    const tt = T.finale + 0.2 + fwOff(k) + c * fwPer(k) + FW_LAUNCH; if (tt > T.finale + 50) break;
    add(tt, at => { noise(at, 0.35, { vol: 0.09, type: 'lowpass', freq: 500, to: 120 }); noise(at + 0.05, 0.5, { vol: 0.03, type: 'highpass', freq: 4500 }); });
  }
  q.sort((a, b) => a.time - b.time); queue = q; qi = 0;
}
function pump() {   // hand upcoming sounds to the audio clock a little ahead of time
  if (state !== 'story' || !AC || !runGain) return;
  const tNow = performance.now() / 1000 - t0;
  while (qi < queue.length && queue[qi].time < tNow + 0.4) {
    const ev = queue[qi], dt = ev.time - tNow;
    if (dt < -0.3) { qi++; continue; }
    if (AC.state !== 'running') break;
    qi++;
    try { ev.fn(AC.currentTime + Math.max(0.01, dt)); } catch (err) { /* a missed sound is fine */ }
  }
}

/* ------------------------------------------------------------ run */
let state = 'idle', t0 = 0, last = 0, booted = false, still = 0;
const storyTime = () => FREEZE != null ? FREEZE : performance.now() / 1000 - t0;

function start() {
  initAudio();
  if (AC) {
    if (AC.state !== 'running') AC.resume();
    if (runGain) { try { runGain.disconnect(); } catch (err) { /* already gone */ } }
    runGain = AC.createGain(); runGain.connect(master);
  }
  buildQueue();
  LET.forEach(l => { l.kick = -99; });
  t0 = performance.now() / 1000 + 0.05;
  state = 'story'; document.body.classList.add('playing');
}
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, Math.max(0, now - last)); last = now;
  ctx.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  try {
    if (state === 'idle') drawStart(FREEZE != null ? 2 : now); else drawStory(storyTime());
    drawTaps(dt);
  } catch (err) {
    if (FREEZE != null) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 4000, 60); ctx.fillStyle = '#c00'; ctx.font = '14px monospace'; ctx.textAlign = 'left'; ctx.fillText(String(err && err.stack || err).slice(0, 300), 6, 20); }
    else throw err;
  }
  if (FREEZE != null && ++still >= 3) return;   // a still frame only needs a few draws
  requestAnimationFrame(frame);
}
function boot() {
  if (booted) return; booted = true;
  wcache = {}; ctx.font = F100;
  const m = ctx.measureText('H'); if (m.actualBoundingBoxAscent > 10) CAP = m.actualBoundingBoxAscent / 100;
  resize();
  if (FREEZE != null) state = FREEZE < 0 ? 'idle' : 'story';
  else if (qs.has('autostart')) start();
  requestAnimationFrame(frame);
}

const toV = ev => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / S, y: (ev.clientY - r.top) / S }; };
cv.addEventListener('pointerdown', ev => {
  if (FREEZE != null || state === 'idle') return;
  const p = toV(ev), t = storyTime();
  burstAt(p.x, p.y);
  let best = null, bd = 1e9;
  for (const l of LET) {
    if (t < landTime(l)) continue;
    const d = Math.hypot(p.x - l.x, p.y - (l.base - CAP * l.size / 2));
    if (d < l.size * 0.6 && d < bd) { bd = d; best = l; }
  }
  if (best) best.kick = t;
  if (AC) {
    if (AC.state !== 'running') AC.resume();
    try { const at = AC.currentTime + 0.005; bell(at, [72, 74, 76, 79, 81, 84, 86, 88][(Math.random() * 8) | 0], 0.25, 0.15, master); if (best) tone(at, 240, 0.25, { to: 620, type: 'triangle', vol: 0.14, dest: master }); } catch (err) { /* no sound, no problem */ }
  }
});
cv.addEventListener('click', ev => { if (FREEZE == null && state === 'idle') { start(); const p = toV(ev); burstAt(p.x, p.y); } });
window.addEventListener('keydown', ev => { if ((ev.key === ' ' || ev.key === 'Enter') && FREEZE == null && state === 'idle') start(); });
document.getElementById('again').addEventListener('click', () => start());
document.getElementById('mute').addEventListener('click', () => {
  muted = !muted; document.body.classList.toggle('muted', muted);
  if (AC) master.gain.setTargetAtTime(muted ? 0 : 0.6, AC.currentTime, 0.02);
});
window.addEventListener('resize', () => { resize(); if (FREEZE != null && booted && still >= 3) { still = 0; requestAnimationFrame(frame); } });
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
setInterval(pump, 90);

if (document.fonts && document.fonts.load) { document.fonts.load(F100, 'BANANAJOECHAMPAGNE').then(boot, boot); setTimeout(boot, 1500); }
else boot();
})();
</script>
</body>
</html>
